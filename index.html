<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1769aa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Situação Medidor">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Situação Medidor</title>
<style>
:root{
 --bg:#f4f8fc;--panel:#fff;--panel2:#eef5fb;--line:#d5e3ef;
 --text:#17324a;--muted:#60778b;--blue:#1769aa;--blue2:#0d80c9;
 --red:#c85454;--shadow:rgba(24,72,108,.07)
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{max-width:520px;margin:auto;min-height:100vh}
.app{padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 22px)}
.forms-header{
 display:flex;align-items:center;gap:9px;
 background:linear-gradient(135deg,#0d4f83,#1769aa 55%,#258bd0);
 color:#fff;border-radius:15px;padding:8px 11px;margin-bottom:10px;
 box-shadow:0 6px 16px rgba(23,105,170,.16)
}
.forms-logo{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.15);
display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.forms-title{font-size:15px;font-weight:900;line-height:1.1}
.forms-subtitle{font-size:10px;margin-top:1px;opacity:.88}
.card{
background:var(--panel);border:1px solid var(--line);border-radius:17px;
padding:13px;margin-bottom:10px;box-shadow:0 5px 17px var(--shadow)
}
h2{font-size:16px;margin:0 0 9px;color:var(--muted)}
label{display:block;font-weight:800;font-size:13px;margin:9px 0 5px}
.req{color:var(--red)}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
input,textarea,select{
width:100%;max-width:100%;min-width:0;border:1.4px solid var(--line);background:#fbfdff;color:var(--text);
border-radius:11px;padding:10px 11px;outline:none
}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:44px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input:focus,textarea:focus,select:focus{
border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,170,.09)
}
textarea{min-height:68px;resize:vertical}
.stage-inline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.stage-inline label{margin:0}
.stage-inline select{width:130px;height:38px;padding:6px 10px;font-weight:800;flex:0 0 auto}
.stage-row{display:flex;gap:7px;align-items:center}
.stage-row button{
width:39px;height:42px;border:1px solid var(--line);background:var(--panel2);
color:var(--blue);border-radius:11px;font-size:20px;font-weight:900;flex:0 0 auto
}
.stage-row select{height:42px;font-weight:800;flex:1}
.addr-row{display:flex;gap:7px}.addr-street{flex:1;min-width:0}.addr-num{width:88px;flex:0 0 auto}
.reading-row{display:flex;gap:7px;margin-bottom:7px}
.reading-row input{flex:1}
.icon-btn{
width:42px;border:1px solid var(--line);border-radius:10px;
background:var(--panel2);color:var(--blue);font-weight:900
}
#photoInput{display:none}
.action-grid{
display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:11px
}
.action-btn{
min-width:0;height:43px;border:1px solid var(--line);border-radius:11px;
background:var(--panel2);color:var(--blue);font-weight:850;font-size:11px;
display:flex;align-items:center;justify-content:center;gap:4px;padding:0 5px
}
.action-btn:nth-child(1){grid-column:span 2}
.action-btn:nth-child(2){grid-column:span 2}
.action-btn:nth-child(3){grid-column:span 2}
.action-btn:nth-child(4){grid-column:span 2}
.action-btn:nth-child(5){grid-column:span 2}
.action-btn:nth-child(6){grid-column:span 2}
.action-icon{font-size:18px;line-height:1}
.save-action{background:var(--blue);border-color:var(--blue);color:#fff}
.photo-action{background:#edf6fd}
.status{min-height:19px;margin-top:7px;text-align:center;color:var(--blue);font-weight:750;font-size:12px}
.previews{display:flex;gap:7px;overflow:auto;margin-top:7px}
.previews img{width:58px;height:58px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.records-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.count{min-width:28px;height:28px;border-radius:14px;background:#e3eff9;color:var(--blue);
display:grid;place-items:center;font-weight:900}
.record{background:#fff;border:1px solid var(--line);border-left:5px solid var(--red);
border-radius:14px;padding:11px;margin-bottom:8px}
.record.resolved{border-left-color:var(--blue)}
.record-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.code{font-size:17px;font-weight:950;color:var(--blue)}
.date{font-size:12px;color:var(--muted);font-weight:750}
.meta{margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.4}
.meta strong{color:var(--text)}
.bad{font-weight:900;color:var(--red)}.good{font-weight:900;color:var(--blue)}
.record-actions{display:flex;gap:7px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.record-actions button{flex:1;min-width:0;padding:6px 4px;border-radius:9px;font-size:12px;font-weight:800;border:1px solid var(--line);background:#fff;line-height:1.2}
.delete{color:var(--red)}.resolve{color:var(--blue)}.edit{color:var(--blue)}
.edit-banner{display:none;align-items:center;justify-content:space-between;gap:8px;background:#fff7e6;border:1px solid #f0d39a;color:#8a5a00;border-radius:11px;padding:8px 10px;font-size:12.5px;font-weight:800;margin-bottom:4px}
.edit-banner.show{display:flex}
.edit-banner button{border:1px solid #f0d39a;background:#fff;color:#8a5a00;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:800}
.card.editing{border-color:#f0d39a;box-shadow:0 0 0 3px rgba(240,180,60,.15)}
.previews img.removable{cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:20px 8px}
.footer{text-align:center;color:#4c82aa;font-weight:700;font-size:12px;padding:13px 0 2px}
.version{margin-top:4px;color:#7a8c9a;font-size:10.5px;font-weight:700}
.copyright{margin-top:5px;color:#7a8c9a;font-size:10px;font-weight:600}
@media(min-width:700px){body{padding-top:12px}}
</style>
</head>
<body>
<main class="app">
<header class="forms-header">
  <div class="forms-logo">📋</div>
  <div>
    <div class="forms-title">Situação Medidor</div>
    <div class="forms-subtitle">Acompanhamento de Leituras</div>
  </div>
</header>

<section class="card" id="formCard">
<div class="edit-banner" id="editBanner"><span id="editText">✏️ Editando registro</span><button type="button" id="cancelEdit">Cancelar</button></div>
<label for="apontador">Apontado por <span class="req">*</span></label>
<input id="apontador" type="text" autocomplete="name" autocapitalize="words" placeholder="Seu nome ou prontuário">
<div class="hint">Fica salvo no aparelho, não precisa digitar toda vez.</div>

<label for="codigo">Código do cliente <span class="req">*</span></label>
<input id="codigo" inputmode="numeric" autocomplete="off" placeholder="Digite o código">

<div class="addr-row">
<div class="addr-street"><label for="endereco">Endereço</label>
<input id="endereco" type="text" autocomplete="off" autocapitalize="words" placeholder="Rua, avenida..."></div>
<div class="addr-num"><label for="numero">Nº</label>
<input id="numero" type="text" inputmode="text" autocomplete="off" placeholder="Nº"></div>
</div>

<label for="medidor">Número do medidor <span class="req">*</span></label>
<input id="medidor" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="Digite o número do medidor">

<label>Leitura <span style="font-weight:600;color:var(--muted);font-size:11px">(opcional)</span></label>
<div id="readingList"></div>
<button class="action-btn" style="width:100%;margin-top:2px" id="addReading" type="button">＋ Adicionar leitura</button>

<label for="situacao">Situação <span class="req">*</span></label>
<select id="situacao">
<option value="">Selecione a situação</option>
<option value="Travado">Travado</option>
<option value="Desligado">Desligado</option>
<option value="Avariado">Avariado</option>
<option value="Medidor caído">Medidor caído</option>
<option value="Necessita tábua de fixação">Necessita tábua de fixação</option>
<option value="Borne derretido">Borne derretido</option>
<option value="Mono 240">Mono 240</option>
<option value="Medidor carbonizado">Medidor carbonizado</option>
</select>

<label for="data">Data</label>
<input id="data" type="date">

<label for="obs">Observações</label>
<textarea id="obs" placeholder="Digite uma observação, se necessário"></textarea>

<div class="stage-inline">
<label for="etapa">Etapa</label>
<select id="etapa"></select>
</div>

<label>Fotos</label>
<input id="photoInput" type="file" accept="image/*" capture="environment" multiple>
<div class="previews" id="previews"></div>
<div class="hint" id="photoHint" style="display:none">Toque na foto para remover.</div>

<div class="action-grid">
<button class="action-btn save-action" id="saveBtn" type="button" title="Salvar registro"><span class="action-icon">💾</span>Salvar</button>
<button class="action-btn photo-action" id="cameraBtn" type="button" title="Tirar foto"><span class="action-icon">📷</span>Foto</button>
<button class="action-btn photo-action" id="galleryBtn" type="button" title="Escolher da galeria"><span class="action-icon">🖼️</span>Galeria</button>
<button class="action-btn" id="exportBtn" type="button" title="Exportar CSV"><span class="action-icon">📄</span>CSV</button>
<button class="action-btn" id="shareBtn" type="button" title="Compartilhar aplicativo"><span class="action-icon">↗️</span>Compartilhar</button>
<button class="action-btn" id="updateBtn" type="button" title="Atualizar aplicativo"><span class="action-icon">🔄</span>Atualizar</button>
</div>
<div class="status" id="status"></div>
</section>

<section class="card">
<div class="records-head">
<h2>Registros da <span id="stageTitle">Etapa 1</span></h2>
<div class="count" id="count">0</div>
</div>
<div id="records"></div>
</section>

<footer class="footer">
<div>Desenvolvido por Luís Ricardo de Almeida Siqueira</div>
<div class="version" id="versionTag"></div>
<div class="copyright">© 2026 Luís Ricardo de Almeida Siqueira — Todos os direitos reservados.</div>
</footer>
</main>

<script>
const APP_VERSION='1.8',APP_DATE='07/10/2026';
const KEY_APONTADOR='situacao-medidor-apontador';
const KEY='situacao-medidor-entries-v2';
let editingId=null,entries=[],selectedSituacao='',selectedFotos=[],readings=[''],stage=1;
const $=id=>document.getElementById(id),stages=Array.from({length:18},(_,i)=>i+1);

function todayStr(){
 const d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
 return `${d.getFullYear()}-${m}-${day}`
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(v){if(!v)return '';const p=v.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v}
function fmtDateTime(ts){
 if(!ts)return '';const d=new Date(ts);
 return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
}
function saveData(){try{localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){}}
function loadData(){
 try{const raw=localStorage.getItem(KEY);entries=raw?JSON.parse(raw):[];if(!Array.isArray(entries))entries=[]}
 catch(e){entries=[]}
}
function renderStages(){
 $('etapa').innerHTML=stages.map(n=>`<option value="${n}">Etapa ${n}</option>`).join('');
 $('etapa').value=stage
}
function renderReadings(){
 $('readingList').innerHTML='';
 readings.forEach((value,i)=>{
  const row=document.createElement('div');row.className='reading-row';
  row.innerHTML=`<input inputmode="numeric" class="reading" placeholder="Leitura ${i+1}" value="${esc(value)}">
  ${readings.length>1?'<button class="icon-btn remove-reading" type="button" aria-label="Remover leitura">−</button>':''}`;
  row.querySelector('.reading').addEventListener('input',e=>readings[i]=e.target.value);
  const rm=row.querySelector('.remove-reading');
  if(rm)rm.onclick=()=>{readings.splice(i,1);renderReadings()};
  $('readingList').appendChild(row)
 })
}
function setSituation(v){selectedSituacao=v;$('situacao').value=v||''}
function renderPhotos(){
 $('previews').innerHTML=selectedFotos.map((src,i)=>`<img class="removable" data-i="${i}" src="${src}" alt="Foto adicionada">`).join('');
 $('photoHint').style.display=selectedFotos.length?'block':'none'
}
function compress(file){
 return new Promise(resolve=>{
  const r=new FileReader();
  r.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    const max=900,scale=Math.min(1,max/img.width),c=document.createElement('canvas');
    c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    resolve(c.toDataURL('image/jpeg',.6))
   };
   img.src=r.result
  };
  r.readAsDataURL(file)
 })
}
async function addPhotos(files){
 for(const f of Array.from(files||[]))if(f.type.startsWith('image/'))selectedFotos.push(await compress(f));
 renderPhotos()
}
function resetForm(){
 $('codigo').value='';$('endereco').value='';$('numero').value='';$('medidor').value='';readings=[''];renderReadings();
 setSituation('');$('data').value=todayStr();$('obs').value='';
 selectedFotos=[];renderPhotos();
 editingId=null;$('editBanner').classList.remove('show');$('formCard').classList.remove('editing')
}
function renderRecords(){
 const filtered=entries.filter(e=>Number(e.etapa)===Number(stage)).sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));
 $('stageTitle').textContent=`Etapa ${stage}`;$('count').textContent=filtered.length;
 if(!filtered.length){$('records').innerHTML='<div class="empty">Nenhum registro nesta etapa.</div>';return}
 $('records').innerHTML=filtered.map(e=>`<article class="record ${e.resolvido?'resolved':''}">
 <div class="record-top"><div class="code">${esc(e.codigo)}</div><div class="date">${esc(fmtDate(e.data))}</div></div>
 ${(e.endereco||e.numero)?`<div class="meta">📍 <strong>${esc(fmtEndereco(e))}</strong></div>`:''}
 <div class="meta">Medidor <strong>${esc(e.medidor)}</strong> · <span class="${e.resolvido?'good':'bad'}">${esc(e.situacao)}</span> · Etapa ${esc(e.etapa)}</div>
 <div class="meta">Leitura: <strong>${esc((e.leituras||[]).length?(e.leituras||[]).join(' / '):'—')}</strong></div>
 <div class="meta">Apontado por: <strong>${esc(e.apontadoPor||'—')}</strong></div>
 <div class="meta">Lançado em ${esc(fmtDateTime(e.criadoEm))}</div>
 ${e.editadoEm?`<div class="meta">Editado em ${esc(fmtDateTime(e.editadoEm))}${e.editadoPor?' por '+esc(e.editadoPor):''}</div>`:''}
 ${e.obs?`<div class="meta">Obs.: ${esc(e.obs)}</div>`:''}
 ${e.fotos?.length?`<div class="previews">${e.fotos.map(x=>`<img src="${x}" alt="Foto do registro">`).join('')}</div>`:''}
 <div class="record-actions"><button class="edit" type="button" onclick="editEntry('${esc(e.id)}')">✏️ Editar</button>
 <button class="resolve" type="button" onclick="toggleResolved('${esc(e.id)}')">${e.resolvido?'↩️ Reabrir':'✅ Resolver'}</button>
 <button class="delete" type="button" onclick="deleteEntry('${esc(e.id)}')">🗑️ Excluir</button></div>
 </article>`).join('')
}
window.editEntry=id=>{
 const e=entries.find(x=>x.id===id);if(!e)return;
 editingId=id;
 $('codigo').value=e.codigo||'';$('endereco').value=e.endereco||'';$('numero').value=e.numero||'';$('medidor').value=e.medidor||'';
 readings=(e.leituras&&e.leituras.length)?e.leituras.slice():[''];renderReadings();
 setSituation(e.situacao||'');$('data').value=e.data||todayStr();$('obs').value=e.obs||'';
 selectedFotos=(e.fotos||[]).slice();renderPhotos();
 stage=Number(e.etapa)||1;$('etapa').value=stage;renderRecords();
 $('editText').textContent=`✏️ Editando código ${e.codigo}`;
 $('editBanner').classList.add('show');$('formCard').classList.add('editing');
 $('status').textContent='Altere o que precisar e toque em Salvar.';$('status').style.color='var(--blue)';
 window.scrollTo({top:0,behavior:'smooth'})
};
window.deleteEntry=id=>{
 if(!confirm('Excluir este registro?'))return;
 if(editingId===id)resetForm();
 entries=entries.filter(e=>e.id!==id);saveData();renderRecords()
}
window.toggleResolved=id=>{
 const e=entries.find(x=>x.id===id);if(!e)return;
 e.resolvido=!e.resolvido;e.resolvidoEm=e.resolvido?Date.now():null;
 saveData();renderRecords()
}
function fmtEndereco(e){return [e.endereco||'',e.numero?('nº '+e.numero):''].filter(Boolean).join(', ')}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(){
 if(!entries.length){alert('Não há registros para exportar.');return}
 const rows=[['Código do cliente','Endereço','Número','Número do medidor','Leituras','Situação','Etapa','Data','Lançado em','Observações','Qtd. fotos','Status','Resolvido em','Apontado por','Editado em','Editado por'],
 ...entries.slice().sort((a,b)=>(Number(a.etapa)-Number(b.etapa))||(b.criadoEm-a.criadoEm))
 .map(e=>[e.codigo,e.endereco||'',e.numero||'',e.medidor,(e.leituras||[]).join(' / '),e.situacao,e.etapa,fmtDate(e.data),fmtDateTime(e.criadoEm),
 e.obs||'',(e.fotos||[]).length,e.resolvido?'Resolvido':'Pendente',e.resolvidoEm?fmtDateTime(e.resolvidoEm):'',e.apontadoPor||'',e.editadoEm?fmtDateTime(e.editadoEm):'',e.editadoPor||''])];
 const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download=`registros-todas-etapas-${todayStr()}.csv`;
 a.click();URL.revokeObjectURL(a.href);
 $('status').textContent='CSV exportado.';$('status').style.color='var(--blue)'
}
function shareApp(){
 const shareData={title:'Situação Medidor',text:'Acesse o aplicativo Situação Medidor.',url:window.location.href};
 try{
  if(navigator.share){navigator.share(shareData).catch(()=>{});return}
  if(navigator.clipboard&&window.isSecureContext){
   navigator.clipboard.writeText(window.location.href);
   $('status').textContent='Link do aplicativo copiado.';$('status').style.color='var(--blue)';return
  }
  prompt('Copie o link do aplicativo:',window.location.href)
 }catch(e){
  if(e&&e.name==='AbortError')return;
  try{prompt('Copie o link do aplicativo:',window.location.href)}catch(_){}
 }
}
$('medidor').addEventListener('focus',()=>{
 $('medidor').setAttribute('inputmode','text');$('medidor').setAttribute('type','search')
});
$('etapa').addEventListener('change',e=>{stage=Number(e.target.value);renderRecords()});
$('situacao').addEventListener('change',e=>setSituation(e.target.value));
$('addReading').onclick=()=>{readings.push('');renderReadings()};
$('cameraBtn').onclick=()=>{
 $('photoInput').setAttribute('capture','environment');
 $('photoInput').click()
};
$('galleryBtn').onclick=()=>{
 $('photoInput').removeAttribute('capture');
 $('photoInput').click()
};
$('photoInput').onchange=e=>{
 addPhotos(e.target.files);
 e.target.value=''
};
$('exportBtn').onclick=exportCSV;
$('shareBtn').onclick=shareApp;
async function updateApp(){
 const st=$('status');st.style.color='var(--blue)';st.textContent='Verificando atualização...';
 try{
  const base=location.href.split('?')[0].split('#')[0];
  const res=await fetch(base+'?check='+Date.now(),{cache:'no-store'});
  if(!res.ok)throw new Error('http');
  const html=await res.text(),m=html.match(/APP_VERSION='([^']+)'/),online=m?m[1]:null;
  if(online&&online!==APP_VERSION){
   st.textContent=`Nova versão ${online} encontrada. Atualizando...`;
   setTimeout(()=>location.replace(base+'?v='+Date.now()),600);
  }else{
   st.textContent=`Você já está na versão mais recente (${APP_VERSION}).`;
  }
 }catch(e){
  st.textContent='Sem conexão. Tente atualizar de novo com internet.';st.style.color='var(--red)';
 }
}
$('updateBtn').onclick=updateApp;
$('cancelEdit').onclick=()=>{resetForm();$('status').textContent='Edição cancelada.';$('status').style.color='var(--muted)'};
$('previews').addEventListener('click',ev=>{
 const img=ev.target.closest('img[data-i]');if(!img)return;
 if(!confirm('Remover esta foto?'))return;
 selectedFotos.splice(Number(img.dataset.i),1);renderPhotos()
});
$('saveBtn').onclick=()=>{
 const apontadoPor=$('apontador').value.trim(),codigo=$('codigo').value.trim(),endereco=$('endereco').value.trim(),numero=$('numero').value.trim(),medidor=$('medidor').value.trim(),
 leituras=readings.map(x=>x.trim()).filter(Boolean);
 if(!apontadoPor||!codigo||!medidor||!selectedSituacao){
  $('status').textContent='Preencha os campos obrigatórios: apontado por, código, medidor e situação.';
  $('status').style.color='var(--red)';return
 }
 if(editingId){
  const e=entries.find(x=>x.id===editingId);
  if(e){
   Object.assign(e,{codigo,endereco,numero,medidor,leituras,situacao:selectedSituacao,etapa:stage,
   data:$('data').value||todayStr(),obs:$('obs').value.trim(),fotos:selectedFotos.slice(),
   editadoEm:Date.now(),editadoPor:apontadoPor});
   if(!e.apontadoPor)e.apontadoPor=apontadoPor;
  }
  saveData();resetForm();renderRecords();
  $('status').textContent='Alterações salvas.';$('status').style.color='var(--blue)';return
 }
 entries.push({
  id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),
  codigo,endereco,numero,medidor,leituras,situacao:selectedSituacao,etapa:stage,apontadoPor,
  data:$('data').value||todayStr(),obs:$('obs').value.trim(),
  fotos:selectedFotos.slice(),resolvido:false,resolvidoEm:null,criadoEm:Date.now()
 });
 saveData();resetForm();renderRecords();
 $('status').textContent=`Registro salvo na Etapa ${stage}.`;$('status').style.color='var(--blue)'
};
$('versionTag').textContent=`Versão ${APP_VERSION} · ${APP_DATE}`;
try{$('apontador').value=localStorage.getItem(KEY_APONTADOR)||''}catch(e){}
$('apontador').addEventListener('input',e=>{try{localStorage.setItem(KEY_APONTADOR,e.target.value.trim())}catch(_){}});
loadData();renderStages();renderReadings();$('data').value=todayStr();renderRecords();
</script>
</body>
</html>
